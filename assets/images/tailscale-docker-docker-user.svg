<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="title desc">
  <title id="title">LAN vs Tailscale into Docker Immich</title>
  <desc id="desc">LAN traffic from 192.168 is allowed through DOCKER-USER to Immich. Tailscale CGNAT 100.64/10 is dropped after DNAT.</desc>

  <rect width="900" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="36" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="650" fill="#1e40af">Why LAN reaches Immich and Tailscale does not</text>
  <text x="40" y="60" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Same host, same container. DOCKER-USER allows RFC1918; Tailscale CGNAT is dropped after DNAT.</text>

  <!-- Laptop -->
  <rect x="40" y="120" width="150" height="72" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <text x="115" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#374151">Laptop (LAN)</text>
  <text x="115" y="168" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#374151">192.168.88.50</text>

  <!-- Phone -->
  <rect x="40" y="320" width="150" height="72" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="115" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#374151">Phone (Tailscale)</text>
  <text x="115" y="368" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#374151">100.87.231.126</text>

  <!-- Host box -->
  <rect x="280" y="100" width="300" height="320" rx="10" fill="#eff6ff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="300" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e40af">Linux host (Tailscale + Docker)</text>

  <!-- DOCKER-USER -->
  <rect x="310" y="155" width="240" height="200" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="326" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#374151">DOCKER-USER (ufw-docker)</text>
  <text x="326" y="210" font-family="ui-monospace, monospace" font-size="12" fill="#374151">RETURN  src 10/8</text>
  <text x="326" y="228" font-family="ui-monospace, monospace" font-size="12" fill="#374151">RETURN  src 172.16/12</text>
  <text x="326" y="246" font-family="ui-monospace, monospace" font-size="12" fill="#047857" font-weight="600">RETURN  src 192.168/16</text>
  <text x="326" y="274" font-family="ui-monospace, monospace" font-size="12" fill="#b91c1c" font-weight="600">DENY NEW → dest 172.16/12</text>
  <text x="326" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">(after DNAT to container)</text>
  <text x="326" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">100.64/10 is not in the list</text>

  <!-- Immich success -->
  <rect x="680" y="175" width="170" height="80" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <text x="765" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#374151">Immich container</text>
  <text x="765" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#374151">172.18.0.3:2283</text>

  <!-- DROP -->
  <rect x="680" y="330" width="170" height="70" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="765" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#374151">DROP</text>
  <text x="765" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#374151">counter ticks up</text>

  <!-- Arrow LAN to host -->
  <defs>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#047857"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <line x1="190" y1="156" x2="310" y2="200" stroke="#047857" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="200" y="145" font-family="ui-monospace, monospace" font-size="11" fill="#047857">src 192.168</text>
  <text x="200" y="158" font-family="ui-monospace, monospace" font-size="11" fill="#047857">:2283</text>

  <line x1="190" y1="356" x2="310" y2="300" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="200" y="370" font-family="ui-monospace, monospace" font-size="11" fill="#b91c1c">src 100.64/10</text>
  <text x="200" y="383" font-family="ui-monospace, monospace" font-size="11" fill="#b91c1c">:2283</text>

  <!-- Host to Immich -->
  <line x1="550" y1="220" x2="680" y2="210" stroke="#047857" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="560" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#047857">RETURN</text>
  <text x="560" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#047857">allowed</text>

  <!-- Host to DROP -->
  <line x1="550" y1="320" x2="680" y2="355" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="555" y="340" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">not allowed</text>
  <text x="555" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#b91c1c">→ DROP</text>

  <!-- Fix footer -->
  <rect x="40" y="450" width="810" height="48" rx="6" fill="#f6f8fa" stroke="#e8e8e8" stroke-width="1"/>
  <text x="56" y="470" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#374151">Fix: add RETURN -s 100.64.0.0/10 in after.rules (IPv4) and fd7a:…/48 in after6.rules,</text>
  <text x="56" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#374151">then ufw reload, and confirm the live DOCKER-USER chain, not only the file on disk.</text>
</svg>
